<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f8f5" />
  <title>FreshGuard — Food freshness, made clear</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="cursor-glow" aria-hidden="true"></div>
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="FreshGuard home"><span class="brand-mark">✳</span><span>fresh<span class="brand-light">guard</span></span></a>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="side-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span>Overview</button>
        <button class="nav-item" data-view="test"><span class="nav-icon">⊕</span>New test</button>
        <button class="nav-item" data-view="history"><span class="nav-icon">◷</span>Test history<span class="nav-count" id="history-count">0</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="side-tip"><span class="tip-spark">✳</span><strong>A little clarity<br>goes a long way.</strong><p>Know what’s fresh.<br>Make a smarter choice.</p></div>
        <button class="nav-item" data-view="profile"><span class="nav-icon">⚙</span>Settings</button>
        <div class="sidebar-user"><div class="avatar">A</div><div><strong>Alex Morgan</strong><small>Personal account</small></div><span class="more">···</span></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar"><div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="page-crumb">Overview</strong></div><div class="topbar-right"><span class="prototype-chip"><i></i> Prototype mode</span><button class="icon-button" aria-label="Notifications" title="Notifications">♧<span class="notify-dot"></span></button><div class="top-avatar">A</div></div></header>
      <div id="app-content" class="content"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="app.js"></script>
</body>
</html>
